<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://api.utkd88.site" crossorigin>
    <link rel="dns-prefetch" href="//api.utkd88.site">
    <link rel="preload" as="image" href="/event-logo.webp" type="image/webp">
    <link rel="preload" as="image" href="/bottle.webp" type="image/webp">
    <link rel="preload" as="image" href="/airpod.webp" type="image/webp">
    <link rel="preload" as="image" href="/limo-green.webp" type="image/webp">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex,nofollow">
    <title>Vòng quay đặc biệt | fh88u</title>
    <style>
      html, body, #event-app { min-height: 100%; }
      body { margin: 0; background: #0c0b11; color: #f8fafc; font-family: Arial, sans-serif; }
      #event-boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: radial-gradient(circle at center, #231b2d 0%, #0c0b11 66%); text-align: center; }
      .event-boot__brand { display: grid; width: 58px; height: 58px; box-sizing: border-box; place-items: center; padding: 4px; border: 1px solid rgba(244, 189, 50, .38); border-radius: 14px; background: #fff; box-shadow: 0 0 24px rgba(244, 189, 50, .16); }
      .event-boot__brand img { width: 100%; height: 100%; object-fit: contain; }
      .event-boot__eyebrow { margin: 10px 0 24px; color: #f4bd32; font-size: 11px; font-weight: 800; letter-spacing: 2px; }
      .event-boot__wheel { position: relative; display: grid; width: 94px; height: 94px; place-items: center; }
      .event-boot__wheel::before { content: ""; position: absolute; inset: 0; border: 3px solid rgba(244, 189, 50, .14); border-top-color: #f4bd32; border-radius: 50%; animation: event-boot-spin 1.1s linear infinite; }
      .event-boot__wheel::after { content: ""; width: 52px; height: 52px; border: 2px solid rgba(244, 189, 50, .42); border-radius: 16px; background: rgba(244, 189, 50, .1); }
      .event-boot__prizes { display: flex; gap: 10px; margin: 22px 0 16px; }
      .event-boot__prizes img { width: 62px; height: 62px; box-sizing: border-box; padding: 4px; border: 1px solid rgba(244, 189, 50, .18); border-radius: 8px; background: #fff; object-fit: contain; }
      .event-boot__bar { width: min(220px, 72vw); height: 5px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, .1); }
      .event-boot__bar::before { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f4bd32, #f97316); animation: event-boot-slide 1s ease-in-out infinite; }
      .event-boot__title { margin: 18px 0 5px; color: #fff; font-size: 17px; font-weight: 800; }
      .event-boot__copy { margin: 0; color: #aaa6b6; font-size: 13px; line-height: 1.5; }
      @keyframes event-boot-spin { to { transform: rotate(360deg); } }
      @keyframes event-boot-slide { from { transform: translateX(-120%); } to { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) { .event-boot__wheel::before, .event-boot__bar::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="event-app">
      <div id="event-boot" role="status" aria-live="polite" aria-label="Đang mở phòng sự kiện">
        <div class="event-boot__brand"><img src="/event-logo.webp" alt="fh88u" width="50" height="50"></div>
        <p class="event-boot__eyebrow">FH88U PRESENTS</p>
        <div class="event-boot__wheel" aria-hidden="true"></div>
        <div class="event-boot__prizes" aria-label="Phần thưởng nổi bật">
          <img src="/bottle.webp" alt="Bình giữ nhiệt logo pp789i" width="62" height="62">
          <img src="/airpod.webp" alt="AirPods Pro" width="62" height="62">
          <img src="/limo-green.webp" alt="Xe VinFast Limo Green" width="62" height="62">
        </div>
        <div class="event-boot__bar" aria-hidden="true"></div>
        <p class="event-boot__title">Đang mở phòng sự kiện...</p>
        <p class="event-boot__copy">Đang xác thực vé tham gia của bạn</p>
      </div>
    </div>
    <script type="module" src="/src/event/main.ts"></script>
  </body>
</html>
