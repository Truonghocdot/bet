<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex,nofollow">
    <link rel="preload" as="image" href="/event-logo.webp" type="image/webp">
    <link rel="preload" as="image" href="/bottle.webp" type="image/webp">
    <link rel="preload" as="image" href="/airpod.webp" type="image/webp">
    <link rel="preload" as="image" href="/limo-green.webp" type="image/webp">
    <title>Đang mở sự kiện | fh88u</title>
    <style>
      html, body { min-height: 100%; }
      body { margin: 0; background: #0c0b11; color: #f8fafc; font-family: Arial, sans-serif; }
      main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: radial-gradient(circle at center, #231b2d 0%, #0c0b11 66%); text-align: center; }
      .brand { display: grid; width: 58px; height: 58px; box-sizing: border-box; place-items: center; padding: 4px; border: 1px solid rgba(244, 189, 50, .38); border-radius: 14px; background: #fff; box-shadow: 0 0 24px rgba(244, 189, 50, .16); }
      .brand img { width: 100%; height: 100%; object-fit: contain; }
      .eyebrow { margin: 10px 0 24px; color: #f4bd32; font-size: 11px; font-weight: 800; letter-spacing: 2px; }
      .wheel { position: relative; display: grid; width: 94px; height: 94px; place-items: center; }
      .wheel::before { content: ""; position: absolute; inset: 0; border: 3px solid rgba(244, 189, 50, .14); border-top-color: #f4bd32; border-radius: 50%; animation: spin 1.1s linear infinite; }
      .wheel::after { content: ""; width: 52px; height: 52px; border: 2px solid rgba(244, 189, 50, .42); border-radius: 16px; background: rgba(244, 189, 50, .1); }
      .prizes { display: flex; gap: 10px; margin: 22px 0 16px; }
      .prizes img { width: 62px; height: 62px; box-sizing: border-box; padding: 4px; border: 1px solid rgba(244, 189, 50, .18); border-radius: 8px; background: #fff; object-fit: contain; }
      .bar { width: min(220px, 72vw); height: 5px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, .1); }
      .bar::before { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f4bd32, #f97316); animation: slide 1s ease-in-out infinite; }
      h1 { margin: 18px 0 5px; color: #fff; font-size: 17px; }
      p { margin: 0; color: #aaa6b6; font-size: 13px; line-height: 1.5; }
      button { display: none; min-height: 44px; margin-top: 18px; box-sizing: border-box; align-items: center; justify-content: center; padding: 0 18px; border: 0; border-radius: 8px; background: #f4bd32; color: #32150b; font-size: 14px; font-weight: 800; cursor: pointer; }
      body.is-failed .wheel::before, body.is-failed .bar::before { animation: none; }
      body.is-failed .bar { display: none; }
      body.is-failed button { display: inline-flex; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes slide { from { transform: translateX(-120%); } to { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) { .wheel::before, .bar::before { animation: none; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="brand"><img src="/event-logo.webp" alt="fh88u" width="50" height="50"></div>
      <div class="eyebrow">FH88U PRESENTS</div>
      <div class="wheel" aria-hidden="true"></div>
      <div class="prizes" aria-label="Phần thưởng nổi bật">
        <img src="/bottle.webp" alt="Bình giữ nhiệt logo pp789i" width="62" height="62">
        <img src="/airpod.webp" alt="AirPods Pro" width="62" height="62">
        <img src="/limo-green.webp" alt="Xe VinFast Limo Green" width="62" height="62">
      </div>
      <div class="bar" aria-hidden="true"></div>
      <h1>Đang chuẩn bị vé tham gia...</h1>
      <p>Bạn sẽ được chuyển vào sự kiện ngay sau khi xác thực</p>
      <button type="button" onclick="window.close()">Đóng và thử lại</button>
    </main>
    <script>
      if (new URLSearchParams(location.search).get('failed') === '1') {
        document.body.classList.add('is-failed')
        document.querySelector('h1').textContent = 'Không thể mở sự kiện'
        document.querySelector('p').textContent = 'Vui lòng đóng trang này và thử lại từ lời mời.'
      }
    </script>
  </body>
</html>
